name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Connect IQ SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            ~/.Garmin/ConnectIQ
            ~/.config/connect-iq-sdk-manager
          key: connect-iq-sdk-9.1.0

      - name: Install Connect IQ SDK Manager
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -sL https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Accept SDK agreement
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          HASH=$(connect-iq-sdk-manager agreement view 2>&1 | grep -i 'hash' | sed 's/.*: //')
          connect-iq-sdk-manager agreement accept -H "$HASH"

      # With empty credentials the login waits on a prompt; fail fast instead of hanging until
      # the 6-hour job default.
      - name: Login to Garmin
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          : "${GARMIN_USERNAME:?Set the GARMIN_USERNAME repository secret}"
          : "${GARMIN_PASSWORD:?Set the GARMIN_PASSWORD repository secret}"
          connect-iq-sdk-manager login --username "$GARMIN_USERNAME" --password "$GARMIN_PASSWORD" < /dev/null

      - name: Download Connect IQ SDK and devices
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          connect-iq-sdk-manager sdk set 9.1.0
          connect-iq-sdk-manager device download -m manifest.xml

      - name: Install Connect IQ SDK Manager (cached run)
        if: steps.cache-sdk.outputs.cache-hit == 'true'
        run: |
          curl -sL https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Set SDK path
        run: echo "SDK_HOME=$(connect-iq-sdk-manager sdk current-path)" >> $GITHUB_ENV

      - name: Set up developer key
        run: |
          echo "${{ secrets.DEVELOPER_KEY }}" | base64 -d > developer_key.der

      - name: Build release package
        run: |
          mkdir -p bin
          "$SDK_HOME/bin/monkeyc" \
            --jungles ./monkey.jungle \
            --output bin/KegelTrainer.iq \
            --private-key developer_key.der \
            --package-app \
            --release \
            --warn

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kegel-trainer-build
          path: bin/*.iq
