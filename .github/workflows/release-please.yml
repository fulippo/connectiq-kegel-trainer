name: Release Please

on:
  push:
    branches: [main]
  # Upload an already published release to the store: Actions > Release Please > Run workflow, tag v1.2.3
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose .iq goes to the store (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Connect IQ SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            ~/.Garmin/ConnectIQ
            ~/.config/connect-iq-sdk-manager
          key: connect-iq-sdk-9.1.0

      - name: Install Connect IQ SDK Manager
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -sL https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Accept SDK agreement
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          HASH=$(connect-iq-sdk-manager agreement view 2>&1 | grep -i 'hash' | sed 's/.*: //')
          connect-iq-sdk-manager agreement accept -H "$HASH"

      # With empty credentials the login waits on a prompt; fail fast instead of hanging until
      # the 6-hour job default.
      - name: Login to Garmin
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          : "${GARMIN_USERNAME:?Set the GARMIN_USERNAME repository secret}"
          : "${GARMIN_PASSWORD:?Set the GARMIN_PASSWORD repository secret}"
          connect-iq-sdk-manager login --username "$GARMIN_USERNAME" --password "$GARMIN_PASSWORD" < /dev/null

      - name: Download Connect IQ SDK and devices
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          connect-iq-sdk-manager sdk set 9.1.0
          connect-iq-sdk-manager device download -m manifest.xml

      - name: Install Connect IQ SDK Manager (cached run)
        if: steps.cache-sdk.outputs.cache-hit == 'true'
        run: |
          curl -sL https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Set SDK path
        run: echo "SDK_HOME=$(connect-iq-sdk-manager sdk current-path)" >> $GITHUB_ENV

      - name: Set up developer key
        run: |
          echo "${{ secrets.DEVELOPER_KEY }}" | base64 -d > developer_key.der

      - name: Build release package
        run: |
          mkdir -p bin
          "$SDK_HOME/bin/monkeyc" \
            --jungles ./monkey.jungle \
            --output bin/KegelTrainer.iq \
            --private-key developer_key.der \
            --package-app \
            --release

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            bin/KegelTrainer.iq \
            --clobber

      - name: Upload to the Connect IQ Store
        if: vars.STORE_SYNC == 'on' && hashFiles('design/store/listing.toml') != ''
        timeout-minutes: 15
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          pip install pillow
          # What's New comes from whats_new in design/store/listing.toml, written for buyers
          python tools/store_sync.py sync --iq bin/KegelTrainer.iq --version "${TAG#v}"

  # Manual run: send an already published release to the store (the .iq is the one on the release)
  store-upload:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload to the Connect IQ Store
        if: vars.STORE_SYNC == 'on' && hashFiles('design/store/listing.toml') != ''
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          pip install pillow
          mkdir -p bin
          gh release download "$TAG" --pattern '*.iq' --dir bin --clobber
          python tools/store_sync.py sync --iq bin/KegelTrainer.iq --version "${TAG#v}"
