# Kegel Trainer on the Connect IQ Store. The repository is the source: change the listing here,
# not under Edit Details, or the next sync puts this back (face-publish skill, tools/store_sync.py).
# Store limits: title 50 characters, description 4000, hero 1440x720 under 2 MB, cover 500x500
# under 300 KB, device icons 128x128 under 150 KB, 1 to 5 screens under 150 KB each.
# Screens are shared by every language; only the texts and the hero are per language.
# "tagline" is ours (the hero's second line); the store ignores it.
# category/subcategory are the store's keys (check prints the live ones and the valid list).

[store]
app_id = "7dfb67e6-aa36-45f9-8895-dd80da66e2bf"

[[languages]]
locale = "en"
title = "Kegel Trainer"
whats_new = "The start screen now appears fully in your language. A few small reliability fixes too."
tagline = "A simple, discreet timer for pelvic floor exercises"
hero_image = "hero.png"
description = """
Kegel Trainer is a simple, discreet guide for your pelvic floor exercises, right on your wrist. Press start, tighten when the arc turns red, relax when it turns green, and let the vibration tell you when to switch.

- Starts with 10 repetitions: contract for 10 seconds, relax for 5. Change any of it to suit you.
- Set the contraction time and the relax time (1 to 60 seconds each), up to 50 repetitions per series and up to 10 series, in the Connect IQ app.
- A colour arc shows the time left: red to contract, green to relax. A 3-second countdown gives you time to get ready.
- A short vibration at every change and a longer one when you finish, so you never have to look.
- Start with the START button or, on touch screens, a tap. Works on round and square screens.
- When you finish, you can save the workout as an ordinary Garmin activity, with a name you choose and a type such as Yoga, Cardio, Flexibility, Breathing or General.

No account, no internet access, no tracking. Workouts are saved only as an ordinary Garmin activity in your own Garmin Connect (you can switch recording off in settings).

Exercise timing only. This is not medical advice; ask a doctor before starting a pelvic floor program, and stop if you feel pain.

Want 10 ready-made programs, a pulse step and weekly progress? See Kegel Trainer Pro.

Available in 18 languages · Compatible with 100+ Garmin devices
"""

